# Автотесты бэкенда на каждый push и pull request: GitHub сам ставит ✅ или ❌ у коммита.
name: backend-tests

on:
  push:
    paths: ["backend/**", ".github/workflows/backend-tests.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-tests.yml"]

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fsp
          POSTGRES_PASSWORD: fsp
          POSTGRES_DB: fsp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fsp -d fsp_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt

      - name: Тесты (SQLite)
        run: pytest -q

      - name: Тесты (PostgreSQL)
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://fsp:fsp@localhost:5432/fsp_test

      - name: Миграции вверх, вниз и снова вверх + демо-данные
        env:
          DATABASE_URL: postgresql+psycopg://fsp:fsp@localhost:5432/fsp_test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          python -m scripts.seed --reset
          python -m scripts.encryption check
